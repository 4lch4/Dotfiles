name: Install

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint install scripts
        run: shellcheck -x install.sh lib/*.sh

  detect:
    name: Profile detection
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: dotfiles

      - name: Prepare container
        run: |
          apt-get update -qq
          # zsh is needed because these steps use --links-only, which skips the
          # package stage that would otherwise install it.
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo git ca-certificates curl zsh >/dev/null
          useradd --create-home --shell /bin/bash tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester

      - name: A bare box resolves to server
        run: |
          cp -r dotfiles /home/tester/.dotfiles
          chown -R tester:tester /home/tester/.dotfiles
          output="$(sudo -u tester -H bash -c 'cd ~ && ~/.dotfiles/install.sh --links-only' 2>&1)"
          echo "$output"
          grep -q "looks like an Ubuntu server, using 'server'" <<<"$output"
          grep -q "profile: server" <<<"$output"

      - name: A desktop resolves to dev
        run: |
          # A real desktop session package, so the check uses real dpkg state
          # rather than a stubbed dpkg-query.
          apt-get install -y -qq --no-install-recommends xfce4-session >/dev/null
          output="$(sudo -u tester -H bash -c 'cd ~ && ~/.dotfiles/install.sh --links-only' 2>&1)"
          echo "$output"
          grep -q "looks like an Ubuntu desktop, using 'dev'" <<<"$output"
          grep -q "profile: dev" <<<"$output"

      - name: An explicit --profile overrides the guess
        run: |
          output="$(sudo -u tester -H bash -c 'cd ~ && ~/.dotfiles/install.sh --links-only --profile server' 2>&1)"
          echo "$output"
          ! grep -q "No --profile given" <<<"$output"
          grep -q "profile: server" <<<"$output"

      - name: DOTFILES_PROFILE overrides the guess too
        run: |
          output="$(sudo -u tester -H bash -c 'cd ~ && DOTFILES_PROFILE=server ~/.dotfiles/install.sh --links-only' 2>&1)"
          echo "$output"
          grep -q "profile: server" <<<"$output"

      - name: A bad profile is still rejected
        run: |
          if sudo -u tester -H bash -c 'cd ~ && ~/.dotfiles/install.sh --profile bogus' 2>&1; then
            echo "::error::a bad --profile was accepted"
            exit 1
          fi

  install:
    name: ${{ matrix.image }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - ubuntu:26.04
        profile:
          - server
          - dev
    steps:
      # A clean image has neither sudo nor a regular user, so set both up to
      # match a fresh server where the installer runs as a normal sudo user.
      - name: Prepare container
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo git ca-certificates curl >/dev/null
          useradd --create-home --shell /bin/bash tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester

      - uses: actions/checkout@v7
        with:
          path: dotfiles

      - name: Install (${{ matrix.profile }})
        run: |
          cp -r dotfiles /home/tester/.dotfiles
          chown -R tester:tester /home/tester/.dotfiles
          sudo -u tester -H bash -c 'cd ~ && ~/.dotfiles/install.sh --profile ${{ matrix.profile }}'

      - name: Re-run is a no-op
        run: sudo -u tester -H bash -c 'cd ~ && ~/.dotfiles/install.sh --profile ${{ matrix.profile }}'

      - name: zsh starts without errors
        run: |
          sudo -u tester -H env TERM=xterm-256color zsh -i -c 'exit' 2> stderr.txt
          if [ -s stderr.txt ]; then
            echo "::error::zsh printed to stderr on startup"
            # One annotation per line so the output shows up on the PR.
            while IFS= read -r line; do echo "::error title=zsh stderr::$line"; done < stderr.txt
            exit 1
          fi
          [ "$(getent passwd tester | cut -d: -f7)" = "$(command -v zsh)" ]

      - name: oh-my-zsh is installed and loaded
        run: |
          sudo -u tester -H env TERM=xterm-256color zsh -i -c '
            set -e
            [ "$ZSH" = "$HOME/.oh-my-zsh" ]
            omz version
            [ "$ZSH_THEME" = steeef ]'

      - name: Dev tools are on PATH
        if: matrix.profile == 'dev'
        run: |
          sudo -u tester -H env TERM=xterm-256color zsh -i -c '
            missing=0
            for cmd in node npm pnpm task gh eza zoxide fzf; do
              # Not `path`: in zsh that variable is tied to $PATH.
              if location=$(command -v "$cmd"); then
                printf "%-12s %s\n" "$cmd" "$location"
              else
                echo "::error title=Not on PATH::$cmd"
                missing=1
              fi
            done
            exit $missing'
