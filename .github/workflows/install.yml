name: Install

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint install scripts
        run: shellcheck -x install.sh lib/*.sh

  hand-off:
    name: POSIX hand-off
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: dotfiles

      - name: Prepare container
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo git ca-certificates curl zsh >/dev/null
          useradd --create-home --shell /bin/bash tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester
          # Deliberately NOT copied to ~/.dotfiles yet: the piped cases need
          # the clone branch to be reachable.
          chmod -R a+rX "$GITHUB_WORKSPACE/dotfiles"

      - name: /bin/sh is not bash
        run: |
          # Guard the premise of this PR: if Ubuntu's sh were bash, the
          # hand-off would be untested.
          [ "$(readlink -f /bin/sh)" != "$(readlink -f "$(command -v bash)")" ]
          ! /bin/sh -c 'set -o pipefail' 2>/dev/null

      - name: cat install.sh | sh (no path, must clone and hand off)
        run: |
          useradd --create-home --shell /bin/bash fresh
          echo 'fresh ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/fresh
          # Read the script from the workspace, not from a home directory:
          # homes are 0700, so one user can't traverse into another's.
          output="$(sudo -u fresh -H sh -c "cat '$GITHUB_WORKSPACE/dotfiles/install.sh' | sh -s -- --links-only" 2>&1)" || true
          echo "$output"
          grep -q "Cloning" <<<"$output"
          grep -q "Installing dotfiles" <<<"$output"
          # --links-only has to survive the hand-off.
          ! grep -q "apt install" <<<"$output"

      - name: curl | bash still works
        run: |
          useradd --create-home --shell /bin/bash piped
          echo 'piped ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/piped
          output="$(sudo -u piped -H bash -c "cat '$GITHUB_WORKSPACE/dotfiles/install.sh' | bash -s -- --links-only" 2>&1)" || true
          echo "$output"
          grep -q "Cloning" <<<"$output"
          grep -q "Installing dotfiles" <<<"$output"

      - name: set up a plain copy for the in-checkout cases
        run: |
          cp -r "$GITHUB_WORKSPACE/dotfiles" /home/tester/.dotfiles
          chown -R tester:tester /home/tester/.dotfiles

      - name: sh install.sh (a path, so no clone)
        run: |
          output="$(sudo -u tester -H sh -c 'sh ~/.dotfiles/install.sh --links-only' 2>&1)" || true
          echo "$output"
          grep -q "Installing dotfiles" <<<"$output"
          ! grep -q "Illegal option" <<<"$output"

      - name: arguments reach bash
        run: |
          # `|| true` because the step runs under `bash -e` and a rejected
          # profile is expected to exit non-zero.
          output="$(sudo -u tester -H sh -c 'sh ~/.dotfiles/install.sh --profile bogus' 2>&1)" || true
          echo "$output"
          grep -q "Unknown profile 'bogus'" <<<"$output"

  install:
    name: ${{ matrix.image }} / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - ubuntu:26.04
        profile:
          - server
          - dev
    steps:
      # A clean image has neither sudo nor a regular user, so set both up to
      # match a fresh server where the installer runs as a normal sudo user.
      - name: Prepare container
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sudo git ca-certificates curl >/dev/null
          useradd --create-home --shell /bin/bash tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester

      - uses: actions/checkout@v7
        with:
          path: dotfiles

      - name: Install (${{ matrix.profile }})
        run: |
          cp -r dotfiles /home/tester/.dotfiles
          chown -R tester:tester /home/tester/.dotfiles
          sudo -u tester -H bash -c 'cd ~ && ~/.dotfiles/install.sh --profile ${{ matrix.profile }}'

      - name: Re-run is a no-op
        run: sudo -u tester -H bash -c 'cd ~ && ~/.dotfiles/install.sh --profile ${{ matrix.profile }}'

      - name: zsh starts without errors
        run: |
          sudo -u tester -H env TERM=xterm-256color zsh -i -c 'exit' 2> stderr.txt
          if [ -s stderr.txt ]; then
            echo "::error::zsh printed to stderr on startup"
            # One annotation per line so the output shows up on the PR.
            while IFS= read -r line; do echo "::error title=zsh stderr::$line"; done < stderr.txt
            exit 1
          fi
          [ "$(getent passwd tester | cut -d: -f7)" = "$(command -v zsh)" ]

      - name: oh-my-zsh is installed and loaded
        run: |
          sudo -u tester -H env TERM=xterm-256color zsh -i -c '
            set -e
            [ "$ZSH" = "$HOME/.oh-my-zsh" ]
            omz version
            [ "$ZSH_THEME" = steeef ]'

      - name: Dev tools are on PATH
        if: matrix.profile == 'dev'
        run: |
          sudo -u tester -H env TERM=xterm-256color zsh -i -c '
            missing=0
            for cmd in node npm pnpm task gh eza zoxide fzf; do
              # Not `path`: in zsh that variable is tied to $PATH.
              if location=$(command -v "$cmd"); then
                printf "%-12s %s\n" "$cmd" "$location"
              else
                echo "::error title=Not on PATH::$cmd"
                missing=1
              fi
            done
            exit $missing'
